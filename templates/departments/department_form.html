{% extends "base.html" %}

{% block title %}Department Form{% endblock %}

{% block content %}

<div class="container mt-4">

<div class="row justify-content-center">

<div class="col-md-7">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>🏢 Department Form</h3>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button class="btn btn-success">
💾 Save
</button>

<a href="{% url 'department_list' %}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
